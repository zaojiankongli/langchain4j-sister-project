services:
  nginx:
    image: nginx:1.28.0
    container_name: nginx
    ports:
      - "81:80"
      - "444:443"
    volumes:
      - /usr/local/service/nginx/conf:/etc/nginx/conf.d
      - /usr/local/service/nginx/html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - zjkl

  mysql:
    image: mysql:8.4.7
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - /usr/local/service/mysql/data:/var/lib/mysql
      - /usr/local/service/mysql/conf:/etc/mysql/conf.d
      - /usr/local/service/mysql/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - zjkl

  redis:
    image: redis:8.6.3
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - /usr/local/service/redis/conf:/usr/local/etc/redis
      - /usr/local/service/redis/data:/data
    restart: unless-stopped
    networks:
      - zjkl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    command: redis-server /usr/local/etc/redis/redis.conf

  backend:
    image: eclipse-temurin:21-jre-alpine
    container_name: backend
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - /usr/local/service/app/app.jar:/app/app.jar:ro
    working_dir: /app
    env_file:
      - /usr/local/service/app/.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    entrypoint:
      - java
      - -XX:+UseZGC
      - -XX:MaxRAMPercentage=75.0
      - -Djava.security.egd=file:/dev/./urandom
      - -jar
      - /app/app.jar
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zjkl

networks:
  zjkl:
    driver: bridge
